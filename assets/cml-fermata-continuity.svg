<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">CML Fermata continuity engineering</title>
<desc id="desc">An elegant continuity-centered concept map with compression, concise clarity, algebraic relationships, tempo grid, validation, and verified engineering evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08121f"/>
    <stop offset="52%" stop-color="#10253c"/>
    <stop offset="100%" stop-color="#171a33"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6cc5ff"/>
    <stop offset="50%" stop-color="#7ce6c2"/>
    <stop offset="100%" stop-color="#d7a6ff"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="560" rx="28" fill="url(#bg)"/>

<!-- subtle flow lines -->
<path d="M40 305 C180 210, 260 405, 390 300 S640 205, 780 305 S1020 400, 1160 295" fill="none" stroke="#213a57" stroke-width="2"/>
<path d="M40 325 C180 230, 260 425, 390 320 S640 225, 780 325 S1020 420, 1160 315" fill="none" stroke="#172d45" stroke-width="2"/>

<text x="58" y="62" fill="#dfeaf6" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2">CML / FERMATA</text>
<text x="58" y="102" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Continuity Engineering</text>
<text x="58" y="132" fill="#9db0c6" font-family="Segoe UI, Arial, sans-serif" font-size="17">Human-led · AI-assisted · evidence-bound</text>

<!-- center continuity -->
<circle cx="600" cy="292" r="102" fill="#0e2034" stroke="url(#flow)" stroke-width="3" filter="url(#glow)"/>
<circle cx="600" cy="292" r="84" fill="none" stroke="#25425f" stroke-width="1"/>
<text x="600" y="282" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">CONTINUITY</text>
<text x="600" y="311" text-anchor="middle" fill="#9fdcc9" font-family="Segoe UI, Arial, sans-serif" font-size="15">preserve meaning through change</text>

<!-- connection lines -->
<g stroke="#35506b" stroke-width="1.6">
  <line x1="512" y1="248" x2="350" y2="203"/>
  <line x1="497" y1="292" x2="300" y2="292"/>
  <line x1="520" y1="350" x2="362" y2="405"/>
  <line x1="688" y1="248" x2="850" y2="203"/>
  <line x1="703" y1="292" x2="900" y2="292"/>
  <line x1="680" y1="350" x2="838" y2="405"/>
</g>

<!-- concept cards -->
<g font-family="Segoe UI, Arial, sans-serif">
  <rect x="135" y="160" width="220" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="162" y="192" fill="#6cc5ff" font-size="16" font-weight="700">COMPRESSION</text>
  <text x="162" y="218" fill="#c3d0dd" font-size="14">less noise · same signal</text>

  <rect x="86" y="255" width="220" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="113" y="287" fill="#7ce6c2" font-size="16" font-weight="700">5–7 WORD CLARITY</text>
  <text x="113" y="313" fill="#c3d0dd" font-size="14">short · stable · understood</text>

  <rect x="145" y="368" width="230" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="172" y="400" fill="#d7a6ff" font-size="16" font-weight="700">ALGEBRAIC RELATIONSHIPS</text>
  <text x="172" y="426" fill="#c3d0dd" font-size="14">constraints · structure · state</text>

  <rect x="845" y="160" width="220" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="872" y="192" fill="#f1c56c" font-size="16" font-weight="700">TEMPO / GRID</text>
  <text x="872" y="218" fill="#c3d0dd" font-size="14">timing · rhythm · drift</text>

  <rect x="894" y="255" width="220" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="921" y="287" fill="#ff9f8c" font-size="16" font-weight="700">VALIDATION</text>
  <text x="921" y="313" fill="#c3d0dd" font-size="14">lint · CI · benchmarks</text>

  <rect x="825" y="368" width="240" height="82" rx="20" fill="#0d1d30" stroke="#29435e"/>
  <text x="852" y="400" fill="#8fb7ff" font-size="16" font-weight="700">HUMAN AUTHORITY</text>
  <text x="852" y="426" fill="#c3d0dd" font-size="14">judgment stays with people</text>
</g>

<!-- evidence strip -->
<rect x="58" y="485" width="1084" height="46" rx="16" fill="#0b1b2c" stroke="#284159"/>
<text x="82" y="514" fill="#9db0c6" font-family="Segoe UI, Arial, sans-serif" font-size="14">VERIFIED EVIDENCE</text>
<text x="255" y="514" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">18 / 18 CI passed</text>
<text x="438" y="514" fill="#7189a4" font-family="Segoe UI, Arial, sans-serif" font-size="15">•</text>
<text x="464" y="514" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Modal benchmark success</text>
<text x="686" y="514" fill="#7189a4" font-family="Segoe UI, Arial, sans-serif" font-size="15">•</text>
<text x="712" y="514" fill="#7ce6c2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3.4937s → 2.7945s</text>
<text x="916" y="514" fill="#7189a4" font-family="Segoe UI, Arial, sans-serif" font-size="15">•</text>
<text x="942" y="514" fill="#7ce6c2" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">−20.0% median</text>
</svg>